name: Generate video (CPU, experimental)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the short video in Hebrew or English"
        required: true
        type: string
        default: "רכבת אדומה נוסעת לאט באזור כפרי ירוק, צילום קולנועי רחב"
      seconds:
        description: "Video duration in seconds"
        required: true
        type: choice
        options:
          - "2"
          - "3"
          - "4"
        default: "2"
      steps:
        description: "Inference steps; higher values take longer on CPU"
        required: true
        type: choice
        options:
          - "8"
          - "12"
          - "16"
        default: "12"
      fps:
        description: "Frames per second"
        required: true
        type: choice
        options:
          - "4"
          - "8"
        default: "8"

permissions:
  contents: read

concurrency:
  group: generate-video-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          free -h
          df -h .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-video.txt

      # Reuse downloaded model weights and tokenizers across runs when GitHub's cache is available.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-video-${{ runner.os }}-py311-v1-${{ hashFiles('requirements-video.txt') }}
          restore-keys: |
            hf-video-${{ runner.os }}-py311-v1-

      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-video.txt

      - name: Generate short video (experimental)
        env:
          PROMPT: ${{ inputs.prompt }}
          SECONDS: ${{ inputs.seconds }}
          STEPS: ${{ inputs.steps }}
          FPS: ${{ inputs.fps }}
        run: python scripts/generate_video.py

      - name: Upload generated video
        if: always() && hashFiles('output/video.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output/video.mp4
          if-no-files-found: error
          retention-days: 7
